# Publica la página en GitHub Pages cada vez que se sube algo a main.
# También se puede correr a mano: pestaña Actions → «GitHub Pages» → Run workflow.
#
# Una sola vez, en el repositorio: Settings → Pages → Build and deployment →
# Source: «GitHub Actions». (Con «Deploy from a branch», GitHub publicaría el
# README con Jekyll en vez de la página.)

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si llega otro push, el que está en curso termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Dice dónde va a vivir la página: la ruta base (/METAHOME) y el dominio.
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Solo el dominio: Next ya agrega la ruta base a la imagen para compartir.
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
